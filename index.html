<script>

function tone(f,d=.15,ty="sine",t0=0,g=.25,f2){const c=ctx(),o=c.createOscillator(),a=c.createGain(),t=c.currentTime+t0,m=mute?0:vol;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(g*m+.0001,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(c.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,g,t0){const c=ctx(),b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=c.createBufferSource(),a=c.createGain();s.buffer=b;a.gain.value=g*(mute?0:vol);s.connect(a).connect(c.destination);s.start(c.currentTime+t0)}
const OK=[()=>[523,659,784,1047].forEach((f,k)=>tone(f,.2,"triangle",k*.1,.3)),()=>{tone(1318,.3,"sine",0,.3);tone(1760,.5,"sine",.12,.3)},()=>{tone(400,.4,"sawtooth",0,.12,1200);tone(1200,.4,"triangle",.4,.25)},()=>{for(let k=0;k<16;k++)noise(.06,.4,k*.04);tone(880,.4,"triangle",0,.25);tone(1175,.5,"triangle",.15,.25)}];
